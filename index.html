    <script>
    (function(){
        var els = document.querySelectorAll('.article-content pre code[class*="language-"]');
        for (var i = 0; i < els.length; i++) {
            var el = els[i];
            // 先处理 text-x-trilium-auto（自动检测无语言），再处理其他 text-x-xxx
            el.className = el.className
                .replace(/\blanguage-text-x-trilium-auto\b/g, 'language-none')
                .replace(/\blanguage-text-x-([\w-]+)\b/g, 'language-$1')
                .replace(/\blanguage-text-([\w-]+)\b/g, 'language-$1')
                .replace(/\bhljs\b/g, '');
            // 清除 hljs 生成的 span，还原纯文本给 Prism 重新高亮
            el.textContent = el.textContent;
        }
    })();
    </script>
    
    <script>
    (function() {
        window._searchArticles = [{"title":"Hello World：第一篇发布","url":"/GNF7sNbiwG5n/","tags":"Hello","summary":""}];
        // 事件委托：PJAX 交换 DOM 后仍生效
        document.addEventListener('click', function(e) {
            var toggle = e.target.closest('.search-toggle');
            if (toggle) {
                e.preventDefault();
                var dropdown = toggle.parentElement.querySelector('.search-dropdown');
                if (!dropdown) return;
                var hidden = dropdown.hasAttribute('hidden');
                dropdown.toggleAttribute('hidden');
                if (hidden) dropdown.querySelector('.search-input').focus();
                return;
            }
            // 点击搜索区域外关闭
            if (!e.target.closest('.search-dropdown') && !e.target.closest('.search-toggle')) {
                var open = document.querySelector('.search-dropdown:not([hidden])');
                if (open) open.setAttribute('hidden', '');
            }
        });
        document.addEventListener('input', function(e) {
            var input = e.target.closest('.search-input');
            if (!input) return;
            var results = input.parentElement.querySelector('.search-results');
            if (!results) return;
            var q = input.value.trim().toLowerCase();
            results.innerHTML = '';
            if (!q) return;
            var matches = (window._searchArticles || []).filter(function(a) {
                return a.title.toLowerCase().indexOf(q) !== -1
                    || a.tags.toLowerCase().indexOf(q) !== -1
                    || a.summary.toLowerCase().indexOf(q) !== -1;
            }).slice(0, 8);
            if (matches.length === 0) {
                results.innerHTML = '<li class="search-empty">无匹配结果</li>';
                return;
            }
            matches.forEach(function(a) {
                var li = document.createElement('li');
                li.className = 'search-result-item';
                var link = document.createElement('a');
                link.href = a.url;
                link.textContent = a.title;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                li.appendChild(link);
                results.appendChild(li);
            });
        });
    })();
    </script>
