<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    透明底 · φ（光子）变形为「光柱 + 海」
    主形单色方案（选其一启用，其它注释掉即可）：
    C1 · 翡翠绿  #0f766e  · 沉稳自然
    C2 · 暖橙    #e85b2e  · 活力醒目
    C3 · 胭脂红  #b33a3a  · 东方高级
    C4 · 青瓷墨绿 #3a4a3e  · 素雅宁静
    C5 · 青靛    #1e3a8a  · 深沉科技（当前启用）
  -->
  <g color="#1e3a8a">
    <!-- φ 变形：光柱竖线 -->
    <line x1="16" y1="4" x2="16" y2="28" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <!-- φ 变形：上半圆 -->
    <path d="M16 5.5 A 8.5 8.5 0 0 1 16 22.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <!-- φ 变形：下半圆延伸为海浪 -->
    <path d="M16 22.5 C 12 25 8 22 4 24 S 0 26 0 26 L 0 32 L 32 32 L 32 26 C 28 24.5 24 28 20 25 C 18.5 24 17 23 16 22.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-opacity=".75"/>
    <!-- 光子 -->
    <circle cx="16" cy="4" r="2" fill="currentColor" fill-opacity=".88"/>
    <circle cx="16" cy="4" r="3.6" fill="none" stroke="currentColor" stroke-width="1.1" stroke-opacity=".38"/>
  </g>
</svg>